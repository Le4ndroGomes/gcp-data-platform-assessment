# Fonte: https://docs.databricks.com/gcp/en/resources/supported-regions
#        https://docs.databricks.com/gcp/en/resources/feature-region-support
# Capturado em: 2026-11-25. A disponibilidade muda com frequência: revalide antes de decisões.
# "cross_geo" = suportado apenas com cross geography routing habilitado.
snapshot_date: "2026-11-25"
