  - predictive_optimization
  - custom_agents_eval
  - knowledge_assistant
  - supervisor_agent
  - ai_query_batch
  - ai_parse_document_v2
  - model_serving_cpu
  - model_serving_gpu
  - external_models
  - fmapi_provisioned
  - fmapi_pay_per_token
